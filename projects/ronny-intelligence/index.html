<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0E1420"/>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ronny背调">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <title>Ronny Intelligence - B2B 客户背调生产台</title>
    <meta name="description" content="基于 Gemini 3.8 Flash 的全球 B2B 客户商业情报、深度背调与生产台系统。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* ========================================================
         华为 HarmonyOS 7 「沉浸光感 / 空间美学」规范体系 (气态唯一标准)
         ======================================================== */
      :root {
        /* 深色主题 (底色 #0E1420 不是纯黑) */
        --bg-deep:      #0E1420;
        --surface-d:    rgba(255, 255, 255, 0.07);
        --surface-d-2:  rgba(255, 255, 255, 0.12);
        --surface-d-float: rgba(20, 28, 44, 0.95);
        --line-d:       rgba(255, 255, 255, 0.13);
        --ink-d:        #F1F5F9;
        --ink-d-2:      rgba(241, 245, 249, 0.70);
        --ink-d-3:      rgba(241, 245, 249, 0.45);

        /* 浅色主题 (底色 #EEF2F8) */
        --bg-light:     #EEF2F8;
        --surface-l:    rgba(255, 255, 255, 0.72);
        --surface-l-2:  rgba(255, 255, 255, 0.90);
        --surface-l-float: rgba(255, 255, 255, 0.98);
        --line-l:       rgba(14, 20, 32, 0.10);
        --ink-l:        #0E1420;
        --ink-l-2:      rgba(14, 20, 32, 0.68);
        --ink-l-3:      rgba(14, 20, 32, 0.45);

        /* 气态光色谱系 (光色只以光的形式出现，不铺面) */
        --glow-1: #14D8C4;  /* 青 */
        --glow-2: #4C9BFF;  /* 蓝 */
        --glow-3: #8B7CFF;  /* 紫 */
        --glow-4: #FF6FB5;  /* 粉 */
        --glow-5: #FFB54C;  /* 金 */
        --danger: #FF6B6B;  /* 警示红 */

        /* 客户资质等级标准色 */
        --lv-a: #FFB54C;    /* A 级 琥珀金 */
        --lv-b: #14D8C4;    /* B 级 极光青 */
        --lv-c: #8B7CFF;    /* C 级 空间紫 */
        --lv-d: #94A3B8;    /* D 级 烟晶灰 */
      }

      /* 默认深色配置 */
      html[data-theme="dark"], body[data-theme="dark"] {
        --bg: var(--bg-deep);
        --surface: var(--surface-d);
        --surface-2: var(--surface-d-2);
        --surface-float: var(--surface-d-float);
        --line: var(--line-d);
        --ink: var(--ink-d);
        --ink-2: var(--ink-d-2);
        --ink-3: var(--ink-d-3);
        --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      /* 浅色主题配置 */
      html[data-theme="light"], body[data-theme="light"] {
        --bg: var(--bg-light);
        --surface: var(--surface-l);
        --surface-2: var(--surface-l-2);
        --surface-float: var(--surface-l-float);
        --line: var(--line-l);
        --ink: var(--ink-l);
        --ink-2: var(--ink-l-2);
        --ink-3: var(--ink-l-3);
        --card-shadow: 0 8px 24px rgba(14, 20, 32, 0.06);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overscroll-behavior-y: none;
        letter-spacing: -0.01em;
        min-height: 100vh;
        transition: background-color 200ms ease, color 200ms ease;
      }

      /* 空间大柔光斑 (radial-gradient, 透明度 0.10–0.18, 600–900px, blur 80px, pointer-events none) */
      .ambient-glow-layer {
        position: fixed;
        inset: 0;
        pointer-events: none !important;
        z-index: 0;
        overflow: hidden;
      }
      .ambient-orb {
        position: absolute;
        border-radius: 9999px;
        filter: blur(80px);
        pointer-events: none !important;
        transform: translateZ(0);
        will-change: transform;
      }
      html[data-theme="dark"] .orb-1 {
        top: -100px;
        left: -80px;
        width: 750px;
        height: 750px;
        background: radial-gradient(circle, rgba(20, 216, 196, 0.16) 0%, transparent 70%);
      }
      html[data-theme="dark"] .orb-2 {
        top: 25%;
        right: -120px;
        width: 850px;
        height: 850px;
        background: radial-gradient(circle, rgba(76, 155, 255, 0.16) 0%, transparent 70%);
      }
      html[data-theme="dark"] .orb-3 {
        bottom: -150px;
        left: 30%;
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(139, 124, 255, 0.14) 0%, transparent 70%);
      }

      html[data-theme="light"] .orb-1 {
        top: -80px;
        left: -60px;
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, rgba(20, 216, 196, 0.11) 0%, transparent 70%);
      }
      html[data-theme="light"] .orb-2 {
        top: 20%;
        right: -80px;
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, rgba(76, 155, 255, 0.11) 0%, transparent 70%);
      }
      html[data-theme="light"] .orb-3 {
        bottom: -120px;
        left: 25%;
        width: 650px;
        height: 650px;
        background: radial-gradient(circle, rgba(139, 124, 255, 0.10) 0%, transparent 70%);
      }

      /* 气态空间卡片：仅外层开毛玻璃，避免嵌套发虚 */
      .harmony-card {
        position: relative;
        background: var(--surface);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }
      .harmony-card:hover {
        border-color: rgba(76, 155, 255, 0.35);
      }
      /* 只有明确标注可点击的行动卡片才缩放，普通容器卡片绝不缩放以免吞掉子按钮的点击事件 */
      .harmony-card-clickable:active {
        transform: scale(0.985);
      }

      /* ========================================================
         HarmonyOS 7 统一层级设计规范 (Z-Index Hierarchy Standard)
         - Level 0: 弥散光斑与背景底层 (z-0 / .z-layer-base，必须声明 pointer-events: none)
         - Level 1: 页面主画布与内容流 (z-1 / .z-layer-content)
         - Level 10: 卡片容器相对定位内容区 (z-10 / .z-layer-card)
         - Level 20: 工具栏与组件级操作栏 (z-20 / .z-layer-toolbar)
         - Level 30: 内部粘性吸顶表头 (z-30 / .z-layer-sticky)
         - Level 40: 卡片内局部浮层/下拉菜单 (z-40 / .z-layer-popover)
         - Level 50: 全局应用常驻导航 Header (z-50 / .z-layer-header)
         - Level 80: 侧滑悬浮抽屉 / 快速筛选侧栏 (z-[80] / .z-layer-drawer)
         - Level 100: 全屏遮罩模态弹窗 / 对话框 (z-[100] / .z-layer-modal)
         - Level 1000: 全局 Toast 吐司与离线指示器 (z-[1000] / .z-layer-toast)
         ======================================================== */
      .z-layer-base    { z-index: 0; }
      .z-layer-content { z-index: 1; }
      .z-layer-card    { z-index: 10; }
      .z-layer-toolbar { z-index: 20; }
      .z-layer-sticky  { z-index: 30; }
      .z-layer-popover { z-index: 40; }
      .z-layer-header  { z-index: 50; }
      .z-layer-drawer  { z-index: 80; }
      .z-layer-modal   { z-index: 100; }
      .z-layer-toast   { z-index: 1000; }

      /* 内嵌区：比卡片高一级白度，圆角 12px，不套毛玻璃 */
      .harmony-inset {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      /* 悬浮层（下拉 / 弹窗 / Toast）：白度再高一级，圆角 20px */
      .elevation-float {
        background: var(--surface-float) !important;
        backdrop-filter: blur(28px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
        border: 1px solid var(--line) !important;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35) !important;
      }

      /* ========================================================
         按钮统一规范 (仅主 / 次 / 危险三种，高度统一 40px，全胶囊 9999px)
         ======================================================== */
      .harmony-btn-primary, .harmony-btn-cta {
        border-radius: 9999px;
        font-weight: 600;
        height: 40px;
        padding-left: 20px;
        padding-right: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 120ms ease, opacity 160ms ease, background-color 160ms ease;
      }
      html[data-theme="dark"] .harmony-btn-primary,
      html[data-theme="dark"] .harmony-btn-cta {
        background-color: var(--glow-2);
        color: #FFFFFF;
        border: 1px solid transparent;
      }
      html[data-theme="dark"] .harmony-btn-primary:hover:not(:disabled),
      html[data-theme="dark"] .harmony-btn-cta:hover:not(:disabled) {
        opacity: 0.90;
      }
      html[data-theme="light"] .harmony-btn-primary,
      html[data-theme="light"] .harmony-btn-cta {
        background-color: rgba(76, 155, 255, 0.16);
        color: #1D4ED8;
        border: 1px solid rgba(76, 155, 255, 0.35);
      }
      html[data-theme="light"] .harmony-btn-primary:hover:not(:disabled),
      html[data-theme="light"] .harmony-btn-cta:hover:not(:disabled) {
        background-color: rgba(76, 155, 255, 0.24);
      }
      .harmony-btn-primary:active:not(:disabled), .harmony-btn-cta:active:not(:disabled) {
        transform: scale(0.985);
      }
      .harmony-btn-primary:disabled, .harmony-btn-cta:disabled {
        opacity: 0.40;
        cursor: not-allowed;
      }

      /* 次按钮：透明底 + 1px --line-* 边 + --ink-* 字 */
      .harmony-btn-secondary {
        background-color: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 9999px;
        font-weight: 500;
        height: 40px;
        padding-left: 16px;
        padding-right: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 120ms ease, background-color 160ms ease, border-color 160ms ease;
      }
      .harmony-btn-secondary:hover:not(:disabled) {
        background-color: var(--surface-2);
        border-color: var(--ink-3);
      }
      .harmony-btn-secondary:active:not(:disabled) {
        transform: scale(0.985);
      }
      .harmony-btn-secondary:disabled {
        opacity: 0.40;
        cursor: not-allowed;
      }
      .harmony-btn-secondary-sm {
        height: 32px;
        padding-left: 12px;
        padding-right: 12px;
        font-size: 12px;
      }

      /* 危险按钮：--danger */
      .harmony-btn-danger {
        background-color: rgba(255, 107, 107, 0.15);
        color: var(--danger);
        border: 1px solid rgba(255, 107, 107, 0.35);
        border-radius: 9999px;
        font-weight: 600;
        height: 40px;
        padding-left: 16px;
        padding-right: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 120ms ease, background-color 160ms ease;
      }
      .harmony-btn-danger:hover:not(:disabled) {
        background-color: rgba(255, 107, 107, 0.25);
      }
      .harmony-btn-danger:active:not(:disabled) {
        transform: scale(0.985);
      }
      .harmony-btn-danger:disabled {
        opacity: 0.40;
        cursor: not-allowed;
      }

      /* 胶囊控件外框 (大圆角全胶囊 9999px) */
      .harmony-capsule-bg {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 9999px;
        padding: 3px;
      }

      /* 规范统一气态动效 (blur + opacity + scale) */
      .gas-out {
        animation: gasOut 320ms cubic-bezier(.2, 0, 0, 1) forwards;
      }
      @keyframes gasOut {
        from { opacity: 1; filter: blur(0);   transform: scale(1); }
        to   { opacity: 0; filter: blur(8px); transform: scale(.96); }
      }
      .gas-in {
        animation: gasIn 360ms cubic-bezier(.2, 0, 0, 1) both;
      }
      @keyframes gasIn {
        from { opacity: 0; filter: blur(8px); transform: scale(.96); }
        to   { opacity: 1; filter: blur(0);   transform: scale(1); }
      }

      /* 等级徽章体系 (四等级唯一规范) */
      .grade-badge-a, .prism-badge-a {
        background: rgba(255, 181, 76, 0.14);
        color: var(--lv-a);
        border: 1px solid rgba(255, 181, 76, 0.35);
      }
      .grade-badge-b, .prism-badge-b {
        background: rgba(20, 216, 196, 0.14);
        color: var(--lv-b);
        border: 1px solid rgba(20, 216, 196, 0.35);
      }
      .grade-badge-c, .prism-badge-c {
        background: rgba(139, 124, 255, 0.14);
        color: var(--lv-c);
        border: 1px solid rgba(139, 124, 255, 0.35);
      }
      .grade-badge-d, .prism-badge-d {
        background: rgba(148, 163, 184, 0.14);
        color: var(--lv-d);
        border: 1px solid rgba(148, 163, 184, 0.30);
      }

      /* 滚动条美化 */
      .custom-scrollbar {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 9999px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--ink-3);
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* 移动端输入防抖动 */
      @media (max-width: 640px) {
        input:not([type="checkbox"]):not([type="radio"]), select, textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 空间美学底蕴柔光层 -->
    <div class="ambient-glow-layer">
      <div class="ambient-orb orb-1"></div>
      <div class="ambient-orb orb-2"></div>
      <div class="ambient-orb orb-3"></div>
    </div>

    <div id="root" class="relative z-10"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
