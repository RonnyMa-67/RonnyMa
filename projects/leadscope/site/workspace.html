<!DOCTYPE html>
<!-- ==================================================================
     LeadScope 工作台层 · 黑白 + 酸橙绿
     六页：总览 / 线索 / 单条详情 / 广告组分析 / 方法帮助 / 设置
     每页有完整示例态与空状态；统计、表格、详情、行动卡、导出同源。
     ================================================================== -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadScope 工作台</title>
<link rel="stylesheet" href="shared.css">
<style>
/* ---- 工作台布局：左侧固定轨 + 内容 ---- */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh;position:relative;z-index:1}
.rail{background:var(--rail-bg);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;box-sizing:border-box}
.rail .logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:var(--f-disp);
  font-weight:700;font-size:15px;padding:6px 10px 18px;letter-spacing:-.01em}
.rail .logo svg circle{fill:var(--accent)}
.rail a.it,.rail button.it{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:rgba(255,255,255,.72);
  text-decoration:none;font-size:14px;transition:background var(--dur),color var(--dur);width:100%;text-align:left}
.rail a.it:hover,.rail button.it:hover{background:rgba(255,255,255,.09);color:#fff}
.rail a.it.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.rail a.it.on svg{color:var(--accent)}
.rail .sp{flex:1}
.rail .bottom{display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.main{padding:26px 32px 90px;min-width:0}
.topbar{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-family:var(--f-disp);font-weight:700;letter-spacing:-.02em;font-size:var(--t-h);line-height:1.14}
.topbar .sub{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px;
  box-shadow:var(--sh-1);min-width:0}
.kpi .k{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.kpi .v{font-family:var(--f-disp);font-weight:700;font-size:32px;letter-spacing:-.02em;margin-top:8px;
  font-variant-numeric:tabular-nums;line-height:1}
.kpi .s{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* 分布 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-8-4{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.dist{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.drow{display:grid;grid-template-columns:74px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.drow .lb{color:var(--ink-2);white-space:nowrap}
.drow .track{height:8px;border-radius:4px;background:rgba(0,0,0,.06);overflow:hidden}
html[data-theme="dark"] .drow .track{background:rgba(255,255,255,.08)}
.drow .track i{display:block;height:100%;border-radius:4px;background:var(--ink-3)}
.drow.hot .track i{background:var(--accent)}
.drow .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.srcrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.srcrow:last-child{border-bottom:none}
.srcrow .b{width:10px;height:10px;border-radius:3px;background:var(--ink-3);flex:none}
.srcrow .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}

/* 筛选栏 */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .select select{font-size:13px;padding:6px 30px 6px 11px}
.filters input[type="search"]{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);min-width:150px}
.filters .count{font-size:13px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{font-size:13px;padding:7px 13px;border-right:1px solid var(--border);color:var(--ink-2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* 表格 */
.tblwrap{overflow:auto;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;min-width:900px}
.tbl th{font-size:11.5px;font-weight:700;color:var(--ink-3);text-align:left;letter-spacing:.04em;
  padding:11px 13px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2}
.tbl td{font-size:13.5px;padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background var(--dur)}
.tbl tbody tr:hover{background:var(--ink-soft)}
.tbl .mut{color:var(--ink-3)}
.tbl .nowrap{white-space:nowrap}

/* 详情四层 */
.lead-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.lead-head h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em}
.lead-head .meta{font-size:13px;color:var(--ink-3);margin-top:6px}
.layers{display:flex;flex-direction:column;gap:16px}
.layer{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);overflow:hidden}
.layer > h2{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:-.01em;
  padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.layer > h2 .n{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.layer > h2 .st{margin-left:auto}
.layer .bd2{padding:18px 20px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 16px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.evi{border:1px solid var(--border);border-radius:14px;background:var(--canvas);padding:13px 15px;margin-bottom:10px}
.evi:last-child{margin-bottom:0}
.evi h4{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--ink-3);margin-bottom:7px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.evi ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.evi li{display:flex;gap:9px;font-size:13.5px;line-height:1.65;color:var(--ink-2);align-items:flex-start}
.evi li svg{flex:none;margin-top:3px}
.evi li b{color:var(--ink);font-weight:600}
.mark{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;
  border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.gaplist{list-style:none;display:flex;flex-direction:column;gap:8px}
.gaplist li{display:flex;gap:9px;font-size:13.5px;color:var(--ink-2);align-items:flex-start}
.flagrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.flagrow .fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-3)}
.flagrow .fl b{font-size:13.5px;color:var(--ink);font-weight:600}
.handgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.handgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-3)}
.handgrid input,.handgrid textarea{font:inherit;font-size:13.5px;padding:9px 11px;border-radius:12px;
  border:1px solid var(--border);background:var(--canvas);color:var(--ink);width:100%}
.handgrid textarea{resize:vertical;min-height:56px}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-top:10px}

/* 导入 */
.imp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.imp .box{cursor:pointer;transition:border-color var(--dur)}
.imp .box:hover{border-color:var(--ink-3)}
.imp .box svg{color:var(--ink-2)}
.imp h3{font-size:14.5px;margin-top:10px}
.imp p{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.6;text-align:left}
.drop{border:1.5px dashed var(--border);border-radius:16px;background:var(--canvas);padding:26px;text-align:center;cursor:pointer}
.drop b{font-size:14.5px;display:block}
.drop p{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.fieldmap{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px}
.fieldmap th{text-align:left;font-size:11.5px;color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line-2)}
.fieldmap td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--ink-2)}
.fieldmap td:first-child{color:var(--ink);font-weight:600}
.okrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.okrow:last-child{border-bottom:none}
.okrow label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.okrow .bad{font-size:12.5px;color:var(--ink-3)}

/* 设置 */
.setrow{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
.setrow .lbl{font-size:14px;font-weight:600}
.setrow .d{font-size:12.5px;color:var(--ink-3);margin-top:3px;max-width:46ch}
.setrow .r{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 状态条 */
.stateline{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* 手机 */
.tabbar{display:none}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:64px;padding:16px 8px;z-index:35}
  .rail .logo span,.rail a.it span,.rail button.it span{display:none}
  .rail a.it,.rail button.it{justify-content:center;padding:11px}
  .main{padding:18px 14px 100px;margin-left:64px}
  .kpis{grid-template-columns:1fr 1fr}
  .grid-2,.grid-8-4{grid-template-columns:1fr}
  .imp{grid-template-columns:1fr 1fr}
  .handgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:96px minmax(0,1fr)}
  .tabbar{display:flex;position:fixed;left:64px;right:0;bottom:0;z-index:34;background:var(--surface);
    border-top:1px solid var(--border);padding:8px 6px;gap:2px}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
    color:var(--ink-3);text-decoration:none;padding:6px 2px;border-radius:10px}
  .tabbar a.on{color:var(--ink);background:var(--ink-soft);font-weight:600}
}
@media(max-width:600px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:26px}
  .imp{grid-template-columns:1fr}
  .tabbar{left:52px}
  .rail{width:52px}
  .main{margin-left:52px;padding:14px 10px 96px}
}
</style>
<link rel="stylesheet" href="design.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div id="app"></div>
<div id="view"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="local-data.js"></script>
<script>
(function(){
  var LS = window.LS, APP = window.APP, T = LS.T;
  var I = APP.icon, ESC = APP.esc, ST = APP.st, LENS = APP.lensMark;

  /* ---------- 数据模式：示例 / 空 ---------- */
  var MODE = 'sample';
  function leads(bid){
    if (MODE === 'empty') return [];
    return LS.byBatch(bid);
  }
  function setMode(m){ MODE = m; APP.rerenderNow(); }

  /* ---------- 壳 ---------- */
  function shell(active, title, sub, rightHtml, bodyHtml){
    var items = [
      ['overview','grid',T({zh:'数据看板',en:'Dashboard'})],
      ['batches','table',T({zh:'客户资产',en:'Clients'})],
      ['attrib','card',T({zh:'表单分析',en:'Form analysis'})]
    ];
    var rail = '<div class="shell"><aside class="rail"><a class="logo" href="#/overview">' + LENS(22) + '<span>LeadScope</span></a>';
    items.forEach(function(it){
      rail += '<a class="it' + (active === it[0] ? ' on' : '') + '" href="#/' + it[0] + '"'
        + (active === it[0] ? ' aria-current="page"' : '') + '>' + I(it[1], 24) + '<span>' + it[2] + '</span></a>';
    });
    rail += '<div class="sp"></div><div class="bottom">'
      + '<a class="it" href="#/learn">' + I('help',24) + '<span>' + T({zh:'Meta 教程',en:'Meta workflow'}) + '</span></a>'
      + '<a class="it" href="#/settings">' + I('gear',24) + '<span>' + T({zh:'设置',en:'Settings'}) + '</span></a>'
      + '<a class="it" href="#/home">' + I('export',17) + '<span>' + T({zh:'返回公开页',en:'Public site'}) + '</span></a>'
      + '<button class="it" type="button" data-act="theme">' + I('dot',17) + '<span>'
      + T({zh:'深浅主题',en:'Theme'}) + '</span></button></div></aside>';

    var bar = '<div class="main"><div class="topbar"><div>' + (title ? '<h1>' + title + '</h1>' : '')
      + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>'
      + '<div class="right">' + (rightHtml || '') + '</div></div>' + bodyHtml + '</div>';
    return rail + bar + '</div>' + APP.tabbar('work');
  }
  function modeSwitch(){
    return '<span class="seg" role="group" aria-label="' + T({zh:'数据模式',en:'Data mode'}) + '">'
      + '<button type="button" data-act="mode" data-mode="sample" class="' + (MODE==='sample'?'on':'') + '">'
      + T({zh:'内容预览',en:'Preview'}) + '</button>'
      + '<button type="button" data-act="mode" data-mode="empty" class="' + (MODE==='empty'?'on':'') + '">'
      + T({zh:'空态预览',en:'Empty preview'}) + '</button></span>';
  }
  function stateline(){
    var q=APP.route().q,r=q.id?LS.findLead(q.id):null,b=LS.BATCHES.find(function(x){return x.id===(q.batch||LS.BATCHES[0].id);});
    var local=r?r.local:(b&&b.local);if(APP.route().q.tab==='import')return '<div class="stateline"><span class="st">'+T({zh:'手动导入 · 文件只在浏览器内解析',en:'Manual import · files stay in your browser'})+'</span></div>';if(APP.route().page==='attrib')local=ATTR&&ATTR.src==='file';
    return '<div class="stateline"><span class="st">'+(MODE==='empty'?T({zh:'空状态预览',en:'Empty preview'}):local?T({zh:'你的本地记录 · 尚未独立核实',en:'Your local records · unverified'}):T({zh:'虚构示例数据',en:'Fictional sample data'}))+'</span><span class="st">'+T({zh:'自动背调待接入',en:'Automated screening not connected'})+'</span></div>';
  }
  function batchSel(cur){
    var h = '<span class="select"><select data-act="batch" aria-label="' + T({zh:'批次',en:'Batch'}) + '">';
    LS.BATCHES.forEach(function(b){
      h += '<option value="' + b.id + '"' + (cur===b.id?' selected':'') + '>'
        + T(b.label) + ' · ' + leads(b.id).length + '</option>';
    });
    return h + '</select></span>';
  }

  /* ================= Dashboard ================= */
  APP.page('overview',{render:function(){
    var c=function(z,e){return T({zh:z,en:e});},bid=APP.route().q.batch||LS.BATCHES[0].id;
    if(!LS.BATCHES.some(function(b){return b.id===bid;}))bid=LS.BATCHES[0].id;
    var list=leads(bid),k=LS.kpi(list),h=stateline();
    if(MODE==='empty'||!list.length)return shell('overview',c('工作台','Workspace'),'',batchSel(bid),h+APP.state('empty',{title:c('从客户线索开始','Start with your leads'),body:c('导入现有表格，或手工录入一条线索。','Import your CSV or enter one lead.'),action:'<a class="btn btn-primary" href="#/batches?tab=import">'+c('导入线索','Import leads')+'</a>'}));
    var pending=list.filter(function(r){return r.ana.verdict==='pending';}),unassigned=list.filter(function(r){return T(r.hand.owner)===c('待分配','Unassigned');});
    var next=pending.length?{kind:'pending',n:pending.length,title:c('先补齐资料','Clarify missing details'),desc:c('身份或需求还不足，先打开客户档案确认。','Open these records and confirm identity or intent.')}:unassigned.length?{kind:'owner',n:unassigned.length,title:c('安排跟进人','Assign an owner'),desc:c('给待跟进客户明确负责人。','Give these clients a clear owner.')}:{kind:'all',n:list.length,title:c('查看客户档案','Review client records'),desc:c('从现有记录里安排下一步。','Choose the next action from your records.')};
    h+='<section class="workspace-next"><div class="workspace-next-label">'+I('up',30)+'<span>'+c('现在先做','START HERE')+'</span></div><div><strong>'+next.n+'</strong><h2>'+next.title+'</h2><p>'+next.desc+'</p></div><button class="btn btn-primary" data-act="dash-filter" data-kind="'+next.kind+'" data-batch="'+bid+'">'+c('查看这批客户','Open clients')+'</button></section>';
    h+='<div class="workspace-counts"><div><small>'+c('本批客户','In this batch')+'</small><b>'+k.total+'</b></div><div><small>'+c('强匹配','Strong fit')+'</small><b>'+k.strong+'</b></div><div><small>'+c('待补信息','Needs info')+'</small><b>'+k.pending+'</b></div><div><small>'+c('待分配','Unassigned')+'</small><b>'+k.unassigned+'</b></div></div>';
    h+='<section class="workspace-recent"><div class="workspace-section-head"><h2>'+c('最近的客户','Client records')+'</h2><a href="#/batches?batch='+bid+'">'+c('查看全部','View all')+'</a></div><div class="workspace-recent-list">'+list.slice(0,4).map(function(r){return '<a href="#/lead?id='+r.id+'"><span class="contact-avatar">'+ESC((T(r.raw.name)||'?').slice(0,1))+'</span><span><b>'+ESC(T(r.raw.name)||c('未具名','Unnamed'))+'</b><small>'+ESC(T(r.ent.nameRaw||r.raw.company)||c('公司待核对','Company to confirm'))+' · '+ESC(T(r.raw.country))+'</small></span><em class="lead-verdict verdict-'+r.ana.verdict+'">'+T(LS.VERDICT[r.ana.verdict])+'</em></a>';}).join('')+'</div></section>';
    h+='<div class="workspace-tools"><a href="#/batches?tab=import">'+I('paste',28)+'<span><b>'+c('导入线索或背调结果','Import leads or research results')+'</b><small>CSV</small></span></a><a href="#/attrib">'+I('card',28)+'<span><b>'+c('查看 Meta 表单分析','Review Meta form analysis')+'</b><small>'+c('按广告组查看已有字段','By ad set and available fields')+'</small></span></a><button data-act="export" data-kind="19">'+I('export',28)+'<span><b>'+c('导出交接表','Export hand-off')+'</b><small>'+c('交到团队自己的在线文档','For your team document')+'</small></span></button></div>';
    var sd=LS.sourceDist(list),max=Math.max.apply(null,sd.map(function(x){return x.n;}).concat([1]));
    h+='<details class="workspace-insights"><summary>'+I('lens',26)+'<span>'+c('展开数据分布','Explore the breakdown')+'</span></summary><div class="workspace-insight-grid"><section><h3>'+c('结论分布','Assessment mix')+'</h3>'+distBars(list)+'</section><section><h3>'+c('来源分布','Sources')+'</h3><div class="source-chart">'+sd.map(function(x){return '<div><span>'+T(x.label)+'</span><div class="source-track"><i style="width:'+Math.round(x.n/max*100)+'%"></i></div><b>'+x.n+'</b></div>';}).join('')+'</div></section></div></details>';
    return shell('overview',c('工作台','Workspace'),c('从当前这批开始。','This batch at a glance.'),batchSel(bid)+'<a class="btn btn-ghost btn-sm" href="#/batches?tab=import">'+c('导入','Import')+'</a>',h);
  }});

  function kpi(k, v, s){
    return '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
  }
  function distBars(list){
    var total = list.length || 1;
    var h = '<div class="dist">';
    Object.keys(LS.VERDICT).forEach(function(x){
      var n = list.filter(function(r){ return r.ana.verdict === x; }).length;
      h += '<div class="drow' + (x==='strong'?' hot':'') + '"><span class="lb">' + T(LS.VERDICT[x]) + '</span>'
        + '<span class="track"><i style="width:' + Math.round(n/total*100) + '%"></i></span>'
        + '<span class="n">' + n + '</span></div>';
    });
    return h + '</div>';
  }
  function srcBars(list){

  function findingsHTML(fs){
    return '<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">'
      + fs.map(function(f){
        var s = T(LS.FIND_TPL[f.k]);
        Object.keys(f.p).forEach(function(k){ s = s.split('{' + k + '}').join(f.p[k]); });

  function bindAttrib(){
    var drop = document.getElementById('attr-drop'), file = document.getElementById('attr-file');
    if (!drop || !file) return;
    drop.addEventListener('click', function(e){ if (e.target.closest('button')) return; file.click(); });
    drop.addEventListener('keydown', function(e){ if(e.target!==drop)return;if (e.key==='Enter'||e.key===' ') { e.preventDefault(); file.click(); } });
    drop.addEventListener('dragover', function(e){ e.preventDefault(); });
    drop.addEventListener('drop', function(e){ e.preventDefault(); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
    file.addEventListener('change', function(){ if (file.files[0]) readFile(file.files[0]); });
  }
  function readFile(f){
    if(!/\.csv$/i.test(f.name)||f.size>10*1024*1024){APP.toast(T({zh:'请选择不超过 10 MB 的 CSV 文件。',en:'Choose a CSV file up to 10 MB.'}));return;}
    var rd = new FileReader();
    rd.onerror=function(){APP.toast(T({zh:'读取失败，请重新选择文件。',en:'Could not read the file. Please select it again.'}));};
    rd.onload = function(){
      try {
        var p = LS.parseTable(rd.result);
        if (!p.rows.length) throw new Error(T({zh:'没解析出数据行',en:'No data rows found'}));
        if (!p.colmap.adset && !p.colmap.campaign)
          throw new Error(T({zh:'没找到广告组或广告系列列，这个文件不适用组分析',
            en:'No ad set or campaign column; group analysis does not apply'}));
        ATTR.rows = LS.classify(p.rows, p.colmap);
        ATTR.groups = LS.aggregate(ATTR.rows);
        ATTR.src = 'file';
        APP.rerenderNow();
      } catch (err) {
        var m = document.getElementById('attr-msg');
        if (m) m.textContent = T({zh:'解析失败：',en:'Parse failed: '}) + err.message;
        APP.toast(T({zh:'文件没解析成功，看下面的提示',en:'File did not parse; see the note below'}));
      }
    };
    rd.readAsText(f, 'utf-8');
  }

  window.__onAction = function(a, el, ev){

    if (a === 'settheme') { APP.setTheme(el.getAttribute('data-v')); APP.rerenderNow(); return; }
    if (a === 'setlang') { APP.setLang(el.getAttribute('data-v')); return; }
    if(a==='asset-view'){ASSET_VIEW=el.getAttribute('data-v');APP.rerenderNow();return;}
    if(a==='asset-drill'){F[el.getAttribute('data-key')]=el.getAttribute('data-v');APP.rerenderNow();return;}
    if(a==='dash-filter'){F={verdict:'',source:'',info:'',priority:'',q:''};if(el.getAttribute('data-kind')==='pending')F.verdict='pending';else if(el.getAttribute('data-kind')==='owner')F.owner='unassigned';else if(el.getAttribute('data-kind')==='priority')F.priority='p1';APP.go('batches',{batch:el.getAttribute('data-batch')});return;}
    if (a === 'batch') { F={verdict:'',source:'',info:'',priority:'',q:''}; APP.go(APP.route().page === 'overview' ? 'overview' : 'batches', {batch: el.value}); return; }
    if (a === 'filter') { F[el.getAttribute('data-key')] = el.value; APP.rerenderNow(); return; }
    if (a === 'clearfilter') { F = {verdict:'',source:'',info:'',priority:'',q:''}; APP.rerenderNow(); return; }
    if (a === 'openlead') { APP.go('lead', {id: el.getAttribute('data-id')}); return; }
    if (a === 'back') { APP.go('batches',{batch:LS.batchOf(APP.route().q.id)}); return; }
    if (a === 'confirmimport') { saveRecords(IMPORT_FIELDS.map(function(r){return LS.makeLocal(r,importSource(),Object.keys(r).map(function(k){return k+'：'+r[k];}).join('\n'));}),T({zh:'本地导入',en:'Local import'})); return; }
    if (a === 'cancelimport') { IMPORT_ROWS=[];IMPORT_FIELDS=[];document.getElementById('import-preview').innerHTML='';return; }
    if (a === 'pickfile' || a === 'attr-pick') { var f = document.getElementById(a==='pickfile'?'lead-file':'attr-file'); if (f) f.click(); return; }
    if (a === 'pickpaste') { var t = document.getElementById('paste-in'); if (t) t.focus(); return; }
    if (a === 'dopaste') { doPaste(); return; }
    if (a === 'pickcard') { APP.toast(T({zh:'OCR 待接入，请先用单条录入',en:'OCR not connected; use single entry for now'})); return; }
    if (a === 'picksingle') { document.getElementById('single-entry').scrollIntoView({block:'start',behavior:'smooth'});document.querySelector('#single-form input').focus(); return; }
    if (a === 'attr-sample') { attrSample(); APP.rerenderNow(); return; }
    if (a === 'export') {
      var kind = el.getAttribute('data-kind'), id = el.getAttribute('data-id');
      var list = id ? [LS.findLead(id)] : LS.filterRows(leads(APP.route().q.batch || LS.BATCHES[0].id), APP.route().page==='batches'?F:{});
      if (!list.length || !list[0]) { APP.toast(T({zh:'没有可导出的行',en:'Nothing to export'})); return; }
      var csv = kind==='ext' ? LS.exportExt(list) : kind==='simple' ? LS.exportSimple(list) : LS.export19(list);
      LS.download('leadscope-' + kind + '-' + Date.now() + '.csv', csv);
      APP.toast(T({zh:'已生成导出文件，共 ',en:'Export ready, '}) + list.length + T({zh:' 条',en:' leads'}));
      return;
    }
  };
  document.addEventListener('input', function(e){
    var a = e.target.getAttribute && e.target.getAttribute('data-act');
    if (a === 'search') {
      F.q = e.target.value; APP.rerenderNow();
      var el = document.querySelector('input[data-act="search"]');
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }
    if (e.target.getAttribute && e.target.getAttribute('data-hand')) {
      var r = LS.findLead(APP.route().q.id);
      if (r) {r.hand[e.target.getAttribute('data-hand')] = e.target.value;if(!LS.localSave())APP.toast(T({zh:'无法暂存改动，请导出当前记录。',en:'Changes could not be stored. Export this record.'}));}
    }
  });
  document.addEventListener('keydown', function(e){
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'openlead') {
      e.preventDefault();APP.go('lead', {id: e.target.getAttribute('data-id')});
    }
  });

  /* ---------- 启动 ---------- */
  APP.setTheme(APP.theme());
  LS.setLang(APP.lang());
  document.body.setAttribute('data-lang', APP.lang());
  APP.rerenderNow();
})();
</script>
</body>
</html>
